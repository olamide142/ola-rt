[package]
name = "ola-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ola"
path = "src/main.rs"

[features]
default = []
cuda = ["burn/cuda", "ola-bench/cuda", "ola-burn/cuda", "ola-kernel/cuda"]
# CubeCL kernels on the CPU, for the paged-attention experiments without a GPU.
cubecl-cpu = ["ola-bench/cubecl-cpu"]
wgpu = ["burn/wgpu", "ola-bench/wgpu", "ola-burn/wgpu", "ola-kernel/wgpu"]

[dependencies]
burn.workspace = true
ola-bench.workspace = true
ola-burn.workspace = true
ola-core.workspace = true
ola-kernel.workspace = true
ola-model.workspace = true
ola-observe.workspace = true
ola-runtime.workspace = true
ola-serve.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
ola-ui.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync"] }

[lints]
workspace = true
