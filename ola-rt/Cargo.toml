[workspace]
resolver = "3"
members = [
    "crates/ola-bench",
    "crates/ola-burn",
    "crates/ola-cli",
    "crates/ola-core",
    "crates/ola-kernel",
    "crates/ola-model",
    "crates/ola-observe",
    "crates/ola-runtime",
    "crates/ola-serve",
    "crates/ola-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Keep the foundation adapter lean. Additional accelerator features must be
# enabled deliberately by the model/execution work that needs them.
burn = { version = "0.22.0", default-features = false, features = ["std", "flex", "extension"] }
burn-backend = { version = "0.22.0", default-features = false }
burn-cubecl = { version = "0.22.0", default-features = false }
burn-store = { version = "0.22.0", default-features = false, features = ["std", "safetensors", "pytorch"] }
crossterm = "0.29"
ola-bench = { path = "crates/ola-bench" }
ola-burn = { path = "crates/ola-burn" }
ola-cli = { path = "crates/ola-cli" }
ola-core = { path = "crates/ola-core" }
ola-kernel = { path = "crates/ola-kernel" }
ola-model = { path = "crates/ola-model" }
ola-observe = { path = "crates/ola-observe" }
ola-runtime = { path = "crates/ola-runtime" }
ola-serve = { path = "crates/ola-serve" }
ola-ui = { path = "crates/ola-ui" }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tokenizers = { version = "0.22.1", default-features = false, features = ["onig"] }
tokio = { version = "1.50", default-features = false }

# Burn 0.22.0's optional Fusion dependency references burn-remote 0.22.0,
# which was not published to crates.io with the rest of that release.
[patch.crates-io]
burn-remote = { git = "https://github.com/tracel-ai/burn", tag = "v0.22.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
