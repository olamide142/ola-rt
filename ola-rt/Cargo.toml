[workspace]
resolver = "3"
members = [
    "crates/ola-bench",
    "crates/ola-burn",
    "crates/ola-core",
    "crates/ola-model",
    "crates/ola-observe",
    "crates/ola-runtime",
    "crates/ola-serve",
    "crates/ola-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
# Keep the foundation adapter lean. Additional accelerator features must be
# enabled deliberately by the model/execution work that needs them.
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray"] }
burn-store = { version = "0.21.0", default-features = false, features = ["std", "safetensors"] }
crossterm = "0.29"
ola-bench = { path = "crates/ola-bench" }
ola-burn = { path = "crates/ola-burn" }
ola-core = { path = "crates/ola-core" }
ola-model = { path = "crates/ola-model" }
ola-observe = { path = "crates/ola-observe" }
ola-runtime = { path = "crates/ola-runtime" }
ola-serve = { path = "crates/ola-serve" }
ola-ui = { path = "crates/ola-ui" }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22.1", default-features = false, features = ["onig"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
